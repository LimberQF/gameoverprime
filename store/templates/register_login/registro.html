{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Cuenta – GameOverPrime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'store/css/reset.css' %}" />
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}" />
  <script src="{% static 'store/js/main.js' %}" defer></script>
  <script src="{% static 'store/js/register_login/validacion.js' %}" defer></script>
</head>
<body>
  <header class="bg-dark text-white py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="btn btn-outline-light btn-sm" href="{% url 'store:home' %}" aria-label="Ir al inicio">&larr; Inicio</a>
      <a class="text-white" href="{% url 'store:login' %}">Iniciar sesión</a>
    </div>
  </header>

  <main class="container my-5">
    <section class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="text-center mb-4">Registro de Compradores</h2>

        {% if messages %}
          <div class="alert alert-warning">
            <ul class="mb-0">
              {% for m in messages %}
                <li class="{{ m.tags }}">{{ m }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}

        <form id="formRegistro" method="post" class="row g-3" novalidate>
          {% csrf_token %}

          <div class="col-md-6">
            <label for="nombreCompleto" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" required>
          </div>

          <div class="col-md-6">
            <label for="usuario" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario" required>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="col-md-6">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
          </div>

          <div class="col-md-6">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="8">
            <div class="form-text">Mínimo 8 caracteres, incluye número y símbolo.</div>
          </div>

          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Repetir contraseña</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
          </div>

          <div class="col-12">
            <label for="direccion" class="form-label">Dirección de despacho (opcional)</label>
            <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle 123, Ciudad">
          </div>

          <div class="col-12 d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <small>&copy; 2025 GameOverPrime</small>
  </footer>
</body>
</html>
