{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar contraseña – GameOverPrime</title>
  <link rel="stylesheet" href="{% static 'store/css/reset.css' %}" />
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}" />
</head>
<body>
  <div class="top">
    <div class="spacer"></div>
    <a class="home-btn" href="{% url 'store:home' %}" aria-label="Ir al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 9.5V21h14V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
  </div>

  <div class="auth-wrap">
    <h2 class="auth-title">Recuperar contraseña</h2>

    {% if messages %}
      <ul class="messages">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}

    <div class="auth-card">
      <form method="post" class="auth-form">
        {% csrf_token %}
        <label class="form-label" for="id_email">Correo electrónico</label>
        {{ form.email }}
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Enviar enlace</button>
          <a class="btn btn-secondary" href="{% url 'store:login' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
