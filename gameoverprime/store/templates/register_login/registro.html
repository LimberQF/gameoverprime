{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Cuenta – GameOverPrime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'store/css/reset.css' %}" />
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}" />
  <script src="{% static 'store/js/main.js' %}" defer></script>
  <script src="{% static 'store/js/register_login/validacion.js' %}" defer></script>
</head>
<body>
  <div class="top">
    <div style="flex:1"></div>
    <a class="home-btn" href="{% url 'store:home' %}" aria-label="Ir al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 9.5V21h14V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
    <a class="login" href="{% url 'store:login' %}">Iniciar sesión</a>
  </div>

  <div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">Registro de Compradores</h2>

    {% if messages %}
      <ul class="messages mb-3">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}

    <div class="auth-card">
      <form id="formRegistro" class="row g-3" method="post" novalidate>
        {% csrf_token %}
        <div class="col-md-6">
          <label for="nombreCompleto" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" required>
        </div>

        <div class="col-md-6">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" required>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="col-md-6">
          <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <div class="col-md-6">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" required>
          <div class="form-text">Mínimo 8 caracteres (más reglas de seguridad).</div>
        </div>

        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Repetir contraseña</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="col-12">
          <label for="direccion" class="form-label">Dirección de despacho (opcional)</label>
          <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle 123, Ciudad">
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <button type="submit" class="btn btn-primary" href="{% url 'store:profile' %}">Enviar</button>
          <button type="reset" class="btn btn-secondary">Limpiar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
