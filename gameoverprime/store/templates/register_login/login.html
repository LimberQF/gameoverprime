{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión – GameOverPrime</title>
  <link rel="stylesheet" href="{% static 'store/css/reset.css' %}" />
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <script src="{% static 'store/js/main.js' %}" defer></script>
  <script src="{% static 'store/js/register_login/login.js' %}" defer></script>
</head>
<body>
  <header class="bg-dark text-white py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="btn btn-outline-light btn-sm" href="{% url 'store:home' %}" aria-label="Ir al inicio">
        &larr; Inicio
      </a>
      <span class="h5 m-0">GameOverPrime</span>
    </div>
  </header>

  <main class="container my-5">
    <section class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="text-center mb-4">Iniciar sesión</h2>

        {% if messages %}
          <div class="alert alert-warning">
            <ul class="mb-0">
              {% for m in messages %}
                <li class="{{ m.tags }}">{{ m }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}

        <form id="formLogin" method="post" novalidate>
          {% csrf_token %}
          {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
          {% endif %}

          <div class="mb-3">
            <label for="usuarioEmail" class="form-label">Usuario o correo</label>
            <input type="text" class="form-control" name="usuarioEmail" id="usuarioEmail" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" name="password" id="password" required minlength="8" />
              <button class="btn btn-outline-secondary" type="button" id="verPw" aria-label="Mostrar/ocultar contraseña">👁</button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="recuerdame" name="recuerdame" checked />
              <label class="form-check-label" for="recuerdame">Recuérdame</label>
            </div>
            <a href="{% url 'store:register' %}" class="text-decoration-none">Crear cuenta</a>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Entrar</button>
            <a href="{% url 'store:home' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <small>&copy; 2025 GameOverPrime</small>
  </footer>
</body>
</html>
