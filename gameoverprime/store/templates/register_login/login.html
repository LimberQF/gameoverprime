{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión – GameOverPrime</title>
  <link rel="stylesheet" href="{% static 'store/css/reset.css' %}" />
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}" />
  <script src="{% static 'store/js/main.js' %}" defer></script>
  <script src="{% static 'store/js/register_login/login.js' %}" defer></script>
</head>
<body>
  <div class="top">
    <div class="spacer"></div>
    <a class="home-btn" href="{% url 'store:home' %}" aria-label="Ir al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 9.5V21h14V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
  </div>

  <div class="auth-wrap">
    <h2 class="auth-title">Iniciar sesión</h2>

    {% if messages %}
      <ul class="messages">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}

    <div class="auth-card">
      <form id="formLogin" class="auth-form" method="post" novalidate>
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        <label class="form-label" for="usuarioEmail">Usuario o correo</label>
        <input class="form-input" name="usuarioEmail" id="usuarioEmail" type="text" required />

        <label class="form-label" for="password">Contraseña</label>
        <div class="form-input-group">
          <input class="form-input" name="password" id="password" type="password" required minlength="8" />
          <button class="btn btn-secondary" type="button" id="verPw" aria-label="Mostrar/ocultar contraseña">👁</button>
        </div>

        <div class="form-row">
          <label class="chk">
            <input type="checkbox" id="recuerdame" name="recuerdame" checked />
            <span>Recuérdame</span>
          </label>
          <a class="muted" href="{% url 'store:register' %}">Crear cuenta</a>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
          <a class="btn btn-secondary" href="{% url 'store:home' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
